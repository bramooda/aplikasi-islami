<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Aplikasi Islami</title>
  
  <!-- Font Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- File CSS Utama -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CONTAINER UTAMA HP (MAX-WIDTH 480PX) -->
  <div class="app-container">
    
    <!-- WADAH STICKY HERO (HEADER + JAM & SHALAT) -->
    <div class="header-hero-wrapper">

      <!-- HEADER ATAS HIJAU -->
      <header class="app-header">
        
        <!-- SISI KIRI: AVATAR & SALAM -->
        <div class="profile-section">
          <div class="avatar-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="user-info">
            <span class="greeting-text">Assalamu'alaikum!</span>
            <h2 class="user-name">Rehan Maulana</h2>
          </div>
        </div>

        <!-- SISI KANAN: IKON NOTIFIKASI LONCENG -->
        <button class="notification-btn" aria-label="Notifikasi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
          </svg>
        </button>
      </header>

      <!-- AREA JAM & SHALAT -->
      <div class="prayer-info">
        <h1 class="main-clock">2<span class="colon">:</span>28</h1>
        <p class="countdown-text">Kurang 13 menit lagi waktu subuh</p>

        <!-- Lokasi & Tanggal -->
        <div class="location-box">
          <div class="location-name">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#ffffff">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
            <span>Kecamatan Kaliwungu, Kab. Kendal</span>
          </div>
          <p class="date-text">7 Jumadil Ula 1448 H / 18 Oktober 2026 M</p>
        </div>
      </div>
    </div> <!-- Akhir dari .header-hero-wrapper -->

        <!-- BOTTOM SHEET CONTAINER (AREA PUTIH MELENGKUNG) -->
    <main class="bottom-sheet">
      
      <!-- HANDLE BAR (GARIS KECIL DI ATAS) -->
      <div class="sheet-handle"></div>

      <!-- GRID 5 MENU MENTAHAN -->
      <div class="menu-grid">
        
        <a href="#" class="menu-item">
          <div class="menu-icon-box"></div>
          <span class="menu-label">Al-Qur'an</span>
        </a>

        <a href="#" class="menu-item">
          <div class="menu-icon-box"></div>
          <span class="menu-label">Tahlil</span>
        </a>

        <a href="#" class="menu-item">
          <div class="menu-icon-box"></div>
          <span class="menu-label">Rutinan & Do'a</span>
        </a>

        <a href="#" class="menu-item">
          <div class="menu-icon-box"></div>
          <span class="menu-label">Maulid</span>
        </a>

        <a href="#" class="menu-item">
          <div class="menu-icon-box"></div>
          <span class="menu-label">Lainnya</span>
        </a>
     </div>
   </main>

 </div>

  <script src="./script.js"></script>
</body>
</html>
