<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Islami</title>
  
  <!-- Font Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- File CSS Utama -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CONTAINER UTAMA HP (MAX-WIDTH 480PX) -->
  <div class="app-container">
    
    <!-- HEADER ATAS HIJAU -->
    <header class="app-header">
      
      <!-- SISI KIRI: AVATAR & SALAM -->
      <div class="profile-section">
        <div class="avatar-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="user-info">
          <span class="greeting-text">Assalamu'alaikum!</span>
          <h2 class="user-name">Rehan Maulana</h2>
        </div>
      </div>

      <!-- SISI KANAN: IKON NOTIFIKASI LONCENG -->
      <button class="notification-btn" aria-label="Notifikasi">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
        </svg>
      </button>

    </header>

  </div>

</body>
</html>
